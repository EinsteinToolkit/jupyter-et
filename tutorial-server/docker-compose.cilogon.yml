version: '3'

volumes:
    home_fs:

services:

  et-cilogon:
    build:
        context: .
        dockerfile: cilogon.docker
    image: einsteintoolkit/et-cilogon
    container_name: et-juphub
    env_file:
        # The file should contain the oauth stuff
        # OAUTH_CALLBACK_URL=https://etk.cct.lsu.edu/hub/oauth_callback
        # OAUTH_CLIENT_ID=...
        # OAUTH_CLIENT_SECRET=...
        - variables.env
    hostname: et-juphub
    ports:
      - 443:443
      - 80:80
    volumes:
      - /etc/ssl:/etc/ssl
      - .:/users
      - home_fs:/home
    restart: on-failure
    entrypoint: bash -x /startup.sh
    # `bash -x` plus jupyterhub's own piped-through stdout run for as long
    # as this container stays up (weeks, between deploys) and Docker's
    # json-file driver has no size limit by default -- this is likely a
    # bigger contributor to the disk filling up than any log file inside
    # the container. logrotate can't touch this; it's outside any volume.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  deploy-hook:
    build:
        context: .
        dockerfile: deploy-hook.docker
    image: einsteintoolkit/et-deploy-hook
    container_name: et-deploy-hook
    env_file:
        # The file should contain:
        # DEPLOY_HOOK_SECRET=<a long random token, used in the webhook URL>
        - variables.env
    environment:
        - COMPOSE_FILE=docker-compose.cilogon.yml
        - COMPOSE_SERVICE=et-cilogon
    volumes:
      # The docker socket lets this container pull/recreate et-cilogon on the
      # host. Mounting the repo dir at the SAME absolute path it lives at on
      # the host (not some other path like /deploy) is required: `docker
      # compose` running in here resolves relative paths (env_file, build
      # context) itself, but the daemon it talks to is the host daemon, so
      # those resolved paths must already be valid host paths. This only
      # works if `docker compose up` is launched from this directory, since
      # $PWD is what supplies the path below.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
      # Read-only: deploy_hook.py only needs to notice when these change,
      # to restart et-juphub so its proxy picks up the renewed cert.
      - /etc/ssl:/etc/ssl:ro
    working_dir: ${PWD}
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
